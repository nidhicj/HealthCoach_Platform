name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily — pings Supabase REST API to prevent free-tier pause
  workflow_dispatch:        # manual trigger for testing without waiting for cron

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Supabase Auth health endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/response.json
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Supabase keep-alive ping returned $HTTP_STATUS — failing job"
            exit 1
          fi
